
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="pos-container">
        <h1 id="page-title">My POS</h1>

        <!-- Menu List -->
        <div id="menu-list">

            <!-- Menu 1 -->
            <div class="menu-item">
                <img src="https://placehold.co/100x100" alt="Burger">

                <div class="menu-info">
                    <h3>Burger</h3>
                    <p>฿89</p>
                </div>

                <div class="menu-actions">
                    <button>-</button>
                    <span>0</span>
                    <button>+</button>
                </div>

                <p class="item-total">฿0</p>
            </div>

            <!-- Menu 2 -->
            <div class="menu-item">
                <img src="https://placehold.co/100x100" alt="Pizza">

                <div class="menu-info">
                    <h3>Pizza</h3>
                    <p>฿159</p>
                </div>

                <div class="menu-actions">
                    <button>-</button>
                    <span>0</span>
                    <button>+</button>
                </div>

                <p class="item-total">฿0</p>
            </div>

            <!-- Menu 3 -->
            <div class="menu-item">
                <img src="https://placehold.co/100x100" alt="French Fries">

                <div class="menu-info">
                    <h3>French Fries</h3>
                    <p>฿49</p>
                </div>

                <div class="menu-actions">
                    <button>-</button>
                    <span>0</span>
                    <button>+</button>
                </div>

                <p class="item-total">฿0</p>
            </div>

        </div>

        <!-- Order Summary -->
        <div id="order-summary">
            <h2>Total Price</h2>
            <p id="total-price">฿0</p>
        </div>

        <button id="checkout-btn">Checkout</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
